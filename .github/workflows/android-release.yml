name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.9.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Tab Soundtrack, Player Modern, Sync History & Background Auto-Update (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **Tab "SOUNDTRACK" di Detail Anime:**
               - Menampilkan daftar lagu Opening & Ending (AnimeThemes -> Jikan v4 -> Kitsu/AniList) lengkap dengan cover art & audio preview 30 detik (Deezer -> iTunes -> MusicBrainz/Cover Art Archive) tanpa API Key.
               - Tab disembunyikan otomatis jika anime tidak memiliki data lagu Opening maupun Ending.
            2. **Peningkatan Video Player (`StreamingScreen`):**
               - Seekbar modern ala YouTube (track tipis, aksen `#FF5722`, buffer abu-abu, thumb lingkaran responsif) dengan penanda segmen Intro/Outro kuning (`#FACC15`) di timeline.
               - Gestur Double-Tap kiri/kanan untuk mundur/maju cepat lengkap dengan pengaturan toggle ON/OFF dan pilihan durasi (`5`, `10`, `15`, `30` detik) di menu Gear.
            3. **Sinkronisasi Watch History Firebase (Khusus Akun Login):**
               - Sinkronisasi otomatis lintas perangkat ke Firestore untuk pengguna login (berkala, saat pause, selesai episode, & keluar player), termasuk penghapusan riwayat & penanda episode ditonton. Pengguna tamu tetap 100% lokal.
            4. **Perbaikan Stabilitas & Anti-Crash:**
               - Memperbaiki crash di halaman Edit Profil & Style Nama (`StyledUsernameText`, variable font API-safe, `ApngAnimationView`, async load kosmetik Discord), menghilangkan unsafe `!!`, dan menambah `GlobalCrashHandler`.
            5. **In-App Background Update:**
               - Pengunduhan APK lewat Foreground Service dengan progres & persentase putih murni (`#FFFFFF`), notifikasi bar persisten, opsi minimize di dalam aplikasi, serta auto-install menimpa aplikasi lama melalui `FileProvider`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
