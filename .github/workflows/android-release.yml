name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/AnimeIn-v1.4.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/AnimeIn-v1.4.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AnimeIn-v1.4.0.apk \;
          fi
          ls -lh build-output/AnimeIn-v1.4.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeIn-APK
          path: build-output/AnimeIn-v1.4.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.4.0-build-${{ github.run_number }}"
          name: "AnimeIn App v1.4.0 - SF Fonts, YouTube Player, PiuPiu Home, Jadwal & Search (Build #${{ github.run_number }})"
          body: |
            ## AnimeIn Android App v1.4.0 Release
            - **Universal Apple SF Pro Font System:**
              - Custom fonts SF Pro Display (`regular`, `medium`, `semibold`, `bold`) disetel sebagai default typography di seluruh aplikasi.
            - **Perombakan Halaman Streaming & Player Video (Tema Putih & Glassmorphism):**
              - Player controls bertema putih bersih dengan efek glassmorphism transparan frosted (tanpa warna hijau).
              - Tombol gear Settings dengan glassmorphism di pojok kanan atas membuka YouTube-style Bottom Sheet (Resolusi video/server, kecepatan putar 0.5x - 2.0x, switch auto next, switch lock screen).
              - Info episode di bawah player: Nomor episode, Judul anime tebal, sinopsis (menghapus tombol server & love it).
              - Seksi `COVER & POSTER`: LazyRow horizontal dengan tinggi tetap sejajar 195dp, gambar bersih tanpa badge poin/upvote.
              - Seksi `COMMENTS`: Indikator balasan dan FAB chat oranye glassmorphism, avatar animasi Pokémon GIF di sisi kanan pada balasan.
              - Database SQLite lokal & proteksi login: Peringatan dialog "Wajib Login Terlebih Dahulu" saat interaksi like/dislike/komentar.
            - **Perombakan Halaman Home (Gaya PiuPiu + Data Asli):**
              - Top Hero Slider auto-scroll bergaya PiuPiu menggunakan data `Jadwal Hari Ini` dengan pagination dots.
              - Pembedaan data riil antara `Episode Baru` (`/3/2/home/new`) dan `Judul Baru` (`/3/2/explore/movie?sort=new`).
              - Seksi `Jat For Yu` di bawah Jadwal Hari Ini dengan kartu landscape mini poster sejajar (50dp x 74dp).
              - Penghapusan total seksi `Baca Manre`.
              - Bottom Navigation Bar 5 tab dengan efek frosted glassmorphism.
            - **Halaman Jadwal (`JadwalScreen`):**
              - Tab scrollable hari (`SEN` - `MIN`), cuplix squircle bar, dan kartu anime padat dengan countdown jam tayang (`time`).
            - **Halaman Search / Explore (`SearchScreen`):**
              - Default explore cards (Kategori, Studio, Tahun, Tipe, Karakter) dengan sub-halaman penuh saat tombol `>` diklik.
              - Mode pencarian aktif: Baris Cuplix tepat di bawah kolom input (tanpa kapsul genre di atasnya), rekomendasi anime otomatis saat query kosong, tombol sort dengan panah hijau (`1-9` / `A-Z`), dan tombol switch Grid vs List.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/AnimeIn-v1.4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
