name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.9.2"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Horizontal Episode List + Search & Strict SemVer Update Checker (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.9.2 Release

            ### Pembaruan Utama:
            1. **Strict SemVer Update Checker (Anti False-Positive):**
               - Sinkronisasi `versionName` dari hulu ke hilir dengan injeksi `-PversionName` pada kompilasi Gradle sesuai `tag_name` rilis GitHub.
               - Pengecekan versi menggunakan perbandingan numerik SemVer segmen demi segmen (`remote > local`). Popup update dilarang muncul jika versi sama atau gagal memuat API.
            2. **Section Daftar Episode Horizontal + Search di Halaman Streaming:**
               - Header rapi judul EPISODE dengan total episode (`• N Ep`) dan kolom pencarian inline minimalis (`Cari ep..`).
               - Adaptive range selector (`1 - 100`, `101 - 200`, dst.) otomatis muncul untuk anime berepisode panjang (> 50 episode) dan disembunyikan untuk anime pendek.
               - Item episode horizontal `LazyRow` berukuran proporsional (tinggi 44dp, sudut membulat 10dp).
               - Active state berlatar aksen Oranye/Crimson dengan teks SF Bold putih dan ikon playing minimalis, serta auto-scroll otomatis ke episode yang sedang ditonton.
               - Pergantian episode instan dengan pembaruan stream, info anime, dan komentar secara mulus.
            3. **In-App Update Notification Popup & Profile Screen:**
               - Dialog pembaruan bergaya iOS dark frosted glassmorphism dan custom markdown renderer.
               - Halaman Profil lengkap dengan edit avatar, banner, dan tautan komunitas.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
