name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.9.3"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Dual-Mode Episode Selector & State Sync Fix (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.9.3 Release

            ### Pembaruan Utama:
            1. **Perbaikan Bug Pergantian Episode di Halaman Streaming:**
               - Pemisahan tegas logika **Ganti Resolusi** (mempertahankan posisi video dengan seek ke `savedPosition`) vs **Ganti Episode** (mereset durasi dan posisi ke `0L`, menghentikan pemutaran lama secara instan, dan memanggil API stream serta komentar untuk episode baru).
               - Sinkronisasi reaktif ExoPlayer dengan key `(currentEpisodeId, currentStreamUrl)` sehingga durasi awal (`00:00`), video player, judul info `Episode [Nomor]`, jumlah views, dan daftar komentar 100% berganti seketika.
            2. **Daftar Episode 2 Mode (Thumbnail Mode & Compact Number Mode) — Anti-Slop UI:**
               - Header terpadu dengan judul **EPISODE**, total episode (`• N Ep`), kolom pencarian ringkas (`Cari ep..`), dan tombol toggle view mode yang persisten di `SharedPreferences`.
               - **Mode 1 (Dengan Gambar):** Kartu horizontal thumbnail 16:9 bersih dengan fallback logo monokrom Yuranime, gradasi gelap bawah untuk teks nomor episode, dan indikator aktif badge `PLAYING` + garis tepi oranye Yuranime (`#FF5722`).
               - **Mode 2 (Tanpa Gambar):** Deretan tombol nomor episode ringkas (tinggi 40dp, lebar min 48dp) berlatar oranye saat aktif dan latar gelap bersih saat non-aktif.
               - Auto-scroll mulus ke episode aktif di kedua mode tampilan.
            3. **Strict SemVer Update Checker & In-App Notice:**
               - Sinkronisasi versi dinamis dari hulu ke hilir dengan SemVer comparison murni segmen demi segmen.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
