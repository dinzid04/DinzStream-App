name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/AnimeIn-v1.2.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/AnimeIn-v1.2.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AnimeIn-v1.2.0.apk \;
          fi
          ls -lh build-output/AnimeIn-v1.2.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeIn-APK
          path: build-output/AnimeIn-v1.2.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.2.0-build-${{ github.run_number }}"
          name: "AnimeIn App v1.2.0 - Streaming Player & Detail Redesign (Build #${{ github.run_number }})"
          body: |
            ## AnimeIn Android App v1.2.0 Release
            - **Detail Screen 100% Reference Redesign:**
              - Edge-to-edge transparent status bar with proper `statusBarsPadding()` so header controls never get cut off.
              - Enlarged cover hero with thin white outline circular play button (`ep 1`).
              - Clean vector icons for Views & Favorites (no emoji slop).
              - Enlarged 2:3 poster (~44% width) with left-aligned vertical metadata stack (no awkward empty middle space).
              - TAB `SEASON`: Bold 23sp title with stacked Views & Favorites to the right.
              - TAB `EPISODE`: Rounded square 1:1 badges (12dp radius), white bold episode badge, search bar, sort order, and infinite scroll pagination.
              - TAB `CUPLIX`: Pure clean video thumbnails without heart badges.
              - TAB `POSTER` & `COVER`: 100% clean images without text/points, tapping opens full-screen image preview.
            - **Halaman Streaming & Custom Video Player:**
              - Media3 ExoPlayer with custom player controls, teal `#26A69A` seekbar, speed `1.0x`, play/pause, and fullscreen orientation handling.
              - Settings modal with Auto Next switch and Screen Lock (active only in fullscreen mode).
              - 2 Action Buttons below player: `SERVER` (with current server indicator) and `LOVE IT` (rating dialog).
              - Server Picker overlay with seamless playback duration synchronization (`seekTo(preservedPos)`).
              - COVER & POSTER horizontal preview section with 3-dot gallery bottom sheet.
              - Episode comments with animated Pokemon GIF avatars via Coil `GifDecoder` and nested replies thread.
            - Anti-slop dark matte theme adhering to design specifications.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/AnimeIn-v1.2.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
