name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.9.3"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Full-Length YT Music Soundtrack, Unduh Lagu & Notif Update In-App (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama v${{ env.APP_VERSION }}:
            1. **Soundtrack Full-Length (YT Music) & Unduh Lagu Offline:**
               - Lagu Opening & Ending dari metadata anime (AnimeThemes / Jikan / MyAnimeList) dicocokkan ke YouTube Music Innertube (`WEB_REMIX` + `VISIONOS` audio stream) untuk pemutaran audio **full-length** lengkap dengan durasi asli, cover album resolusi tinggi, dan cadangan Deezer/iTunes/MusicBrainz.
               - Menambahkan tombol **Unduh Lagu** pada setiap item soundtrack untuk menyimpan file audio (`.m4a`/`.webm`/`.mp3`) langsung ke `Music/Yuranime`.
               - Tab `SOUNDTRACK` kini selalu tampil di halaman detail anime dan menampilkan informasi yang jelas jika anime tidak memiliki lagu Opening maupun Ending.
            2. **Notifikasi Update In-App Lebih Andal (Tanpa Bolak-Balik Chrome):**
               - Menambahkan retry otomatis & fallback halaman publik GitHub Releases bebas rate-limit pada `UpdateChecker`, serta DNS IPv4-first agar popup update selalu muncul di dalam aplikasi saat dibuka dan langsung mengunduh + auto-install APK di latar belakang.
            3. **Video Player Modern, Sync Watch History Firebase & Stabilitas:**
               - Seekbar modern dengan penanda Intro/Outro kuning (`#FACC15`), gestur Double-Tap to Seek + pengaturannya, sinkronisasi Watch History ke Firestore untuk pengguna login, serta perbaikan stabilitas Edit Profil & `GlobalCrashHandler`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
