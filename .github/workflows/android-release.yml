name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.4.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Kerapian Visual Beranda Komik, Chatroom Komunitas & Scraper KomikStation (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Fitur Baru:
            1. **Perbaikan Hero Slider Beranda Komik:**
               - Menggabungkan data rekomendasi `komikid` dengan slider banner sehingga pilihan komik lebih beragam dan kaya.
               - Mengurangi kegelapan scrim overlay menjadi 45%–55% agar backdrop ilustrasi belakang tampil terang, jelas, dan hidup.
               - Poster di sisi kanan menempel 100% penuh ke sudut bingkai (`RoundedCornerShape(12.dp)`) tanpa celah kosong.

            2. **Jarak Antar-Section & Garis Pemisah Elegan:**
               - Memberikan jarak vertikal proporsional `26.dp` dan garis pemisah tipis `HorizontalDivider` `#181B22` di antara setiap section agar struktur halaman terlihat rapi dan tidak dempet.

            3. **Penyelarasan Presisi `RILISAN TERBARU`:**
               - Mengunci tinggi poster (`width = 76.dp`, `fillMaxHeight()`) dengan kolom teks (`height = 110.dp`, `verticalArrangement = SpaceBetween`).
               - Ujung atas poster sejajar rata dengan judul komik dan ujung bawah poster 100% sejajar rata dengan baris chapter ke-3.

            4. **Fix Angka 2 Digit & Vector Icons di `TERPOPULER SEPANJANG MASA`:**
               - Memperlebar wadah peringkat (`48.dp`) dan mengunci `maxLines = 1`, `softWrap = false` font SF Bold 26sp sehingga angka 10, 13, 14 tidak lagi terpotong ke bawah.
               - Menghapus karakter emoji mata, digantikan dengan Vector Icon `Icons.Outlined.Visibility` `#94A3B8` dan bintang solid `Icons.Filled.Star` `#FACC15`.

            5. **Chatroom Komunitas Cbox + Maskot Anime:**
               - Ditambahkan tepat di bawah section Rilisan Terbaru.
               - Kotak Cbox WebView dengan tinggi `390.dp` dan sudut `14.dp`.
               - Maskot anime di pojok kanan atas dengan tangan menempel pas di atas bingkai kotak chat.

            6. **Integrasi Scraper Live `https://komikstation.org/`:**
               - Section `YANG NGGAK KALAH SERU!`: Tab dinamis (Gender Bender, Romance, Yaoi, dll.) dalam kontainer `#12141A` + 3 kartu komik dengan bendera negara dan 5 bintang vector solid/outline sesuai rating.
               - Section `GENRE`: 2 kolom vertikal huruf kapital tebal (#E2E8F0) dengan dialog daftar komik saat diklik.
               - Section `SERIES TERBARU`: Daftar vertikal komik terbaru dengan poster, judul, genre, dan tahun rilis.
               - Navigasi Detail Komik & Pembaca Chapter untuk komik KomikStation berjalan lancar.

            7. **Isolasi Referer OkHttpClient Coil:**
               - Memisahkan Referer otomatis berdasarkan domain: AnimeIn (tanpa referer), komikid (`https://app.shinigami.asia/`), dan KomikStation (`https://komikstation.org/`).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
