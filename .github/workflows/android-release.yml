name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.7.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Redesign Profile, Geometric Title Badge, Real-Time Leaderboard & R2 CDN Upload (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Fitur Baru:
            1. **Redesign Total Halaman Profile (ProfileScreen):**
               - Mengikuti tata letak referensi baru dengan palet Yuranime (Deep Obsidian `#0B0B0B` + Crimson `#E11D48` & Vibrant Orange `#FF5722`).
               - Header Banner edge-to-edge (`195.dp`) dengan gradasi dark vignette halus dan 3 tombol ikon bulat minimalis di kanan atas (Preview Profil Publik, Edit Profil, Pengaturan).
               - Avatar kiri (`86.dp`) dengan Circular EXP Progress Ring (`strokeWidth = 3.dp`) yang sinkron real-time dengan persentase EXP pengguna.
               - Identitas rata kiri tanpa kotak overlay: Display Name + `#ID` 4 digit unik, Email asli, Tanggal Bergabung asli dari Firestore, Bio, Baris Pill (`Member | Lv. | Gelar Rank`), Slot Custom Title, dan Full-Width EXP Bar.
               - Area menu bersih di bawah EXP Bar dengan 2 kartu highlight ringkas (`Papan Peringkat` & `Points & Rewards`) serta baris navigasi editorial (`Unduh`, `Koleksi & Riwayat`, `Info Aplikasi`, `Keluar Akun`).

            2. **Sistem Custom Title Geometris (`GeometricTitleBadge`) & `Points & Rewards`:**
               - Komponen vektor `GeometricTitleBadge` bergaya heksagon + sayap poligon meruncing dengan 4 kasta warna sesuai level (Starter Crimson Slate, Vanguard Blaze Orange-Red, Royal Amethyst, dan Mythic Sovereign Gold-Crimson).
               - Sistem Misi Harian & Mingguan, Milestone Level Title (Lv. 1, 5, 10, 15, 25, 50), serta Katalog Tukar Poin & Frame Avatar yang 100% sinkron real-time dengan Firestore.

            3. **Redesign Papan Peringkat (`LeaderboardScreen`) 100% Real-Time Tanpa Data Palsu:**
               - Menghapus seluruh data bot/placeholder statis; menampilkan 100% pengguna asli dari koleksi `users` di Firebase Firestore.
               - Podium Top 1, Top 2, dan Top 3 dilengkapi Custom Frame Border presisi konsentris di tengah avatar.
               - Perbaikan header tabel `"Peringkat"` anti-terpotong, baris peringkat 4+ modern tanpa siku kuning kaku, serta floating bar bawah `"Posisi Peringkat Kamu"`.

            4. **Kompresi WebP & Upload Avatar/Banner ke Cloudflare R2 / Dinz CDN (`R2CdnUploader`):**
               - Gambar dari galeri otomatis di-resize dan dikompresi ke format WebP tajam (`< 150KB`) lalu diunggah ke CDN untuk disimpan sebagai URL publik permanen di Firestore.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
