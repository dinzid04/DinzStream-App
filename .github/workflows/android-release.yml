name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/AnimeIn-v1.5.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/AnimeIn-v1.5.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AnimeIn-v1.5.0.apk \;
          fi
          ls -lh build-output/AnimeIn-v1.5.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeIn-APK
          path: build-output/AnimeIn-v1.5.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.5.0-build-${{ github.run_number }}"
          name: "AnimeIn App v1.5.0 - Search Banners, PiuPiu In-Place Player Menu, Watch History & Pagination (Build #${{ github.run_number }})"
          body: |
            ## AnimeIn Android App v1.5.0 Release
            - **Halaman Search / Cari (`SearchScreen`):**
              - Kartu `KATEGORI` & `TAHUN`: Full background image banner (`fillMaxSize`, `ContentScale.Crop`, `height(96.dp)`, rounded `12.dp`). Kategori label Theme/Genre/Demographic abu-abu & judul besar SF Bold `#222222` di kiri; Tahun SF Bold `#222222` di kanan.
              - Kartu `STUDIO` & `TIPE`: Ukuran lebih besar (`height(58.dp)`, rounded `12.dp`), latar navy gelap `#18202C`, teks SF Bold `17.5.sp` putih bersih.
              - Kartu `KARAKTER`: Tinggi `96.dp`, latar `#18202C`, nama karakter SF Bold `21.sp` di kiri, gambar karakter di kanan dengan horizontal gradient fade overlay menyatu mulus tanpa garis potong.
              - Header & navigasi chevron `>` tombol lingkaran gelap (`26.dp`, `#1E2430`).
            - **Halaman Streaming & Player Video (`StreamingScreen`):**
              - Player Header: Tombol Back (`<-`) dan tombol Settings (`⚙`) bersih tanpa bingkai glassmorphism.
              - Player Bottom Bar: Bar durasi bersih dengan slider putih murni; indikator kecepatan dihapus dari bar bawah.
              - Floating In-Place Settings Menu (Gaya PiuPiu): Mengambang di pojok kanan atas player (`210.dp`, `#141414E6`, rounded `12.dp`). Menu utama dan in-place subviews untuk Resolusi / Kualitas dan Kecepatan Putar (`0.25x` s/d `2.0x` dengan tanda centang `✓`).
              - Info Episode: Baris 1 `Episode [N]` (`15.sp`, SF SemiBold, `#9CA3AF`), Baris 2 Judul Asli Anime (`22.sp`, SF Bold, putih), Baris 3 Sinopsis Asli Anime (maksimal 3 baris dengan ellipsis, `#9CA3AF`).
              - Seksi `COVER & POSTER`: Berselang-seling (Poster 2:3 -> Cover 16:9 -> Poster 2:3 -> Cover 16:9) dengan tinggi sama persis `195.dp`.
              - Aksi Komentar: Baris bersih selebar layar dengan Like di kiri, Dislike di tengah, dan Balasan di kanan (ikon chat oranye `#FF5722` + teks abu-abu `#9CA3AF`, tanpa kotak pill border).
            - **Halaman Home (`HomeScreen`):**
              - Infinite Scroll / Pagination Horizontal pada seluruh row (`Sedang Hangat`, `Episode Baru`, `Judul Baru`, `Jat For Yu`, `Paling Dinanti`, `Paling Populer`).
              - Navigasi Tombol Panah `>` ke Sub-Halaman Daftar Lengkap dengan layout kartu identik Halaman Jadwal (Poster `115.dp` `2:3`, Genre oranye, Judul SF Bold putih, Sinopsis 2 baris, Views merah, Favorites kuning) beserta infinite scroll vertikal.
              - Lanjut Nonton Nyata (Watch History): Terintegrasi dengan SQLite database lokal; disembunyikan otomatis bila kosong, dan mengklik kartu langsung melanjutkan tontonan di detik terakhir.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/AnimeIn-v1.5.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
