name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.1.2"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix 100% AnimeIn Images & Navbar Liquid Glass Toggle (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Perbaikan Utama:
            1. **Perbaikan Total Seluruh Gambar AnimeIn (Hero Slider, Cuplix, Episode Baru, Sedang Hangat, Jat For Yu, Paling Dinanti, Jadwal & Detail):**
               - Memperbaiki bug Cloudflare WAF 403 Forbidden pada CDN AnimeIn (`api.animein.net`, `xyz-api.animein.net`, `animein.net`): menghapus header browser `Mozilla/5.0` dan `x-proxy-secret` dari request download aset gambar, menggantikannya dengan User-Agent standar OkHttp (`okhttp/4.12.0`) tanpa header Referer asing.
               - Menginisialisasi Coil ImageLoader global (`Coil.setImageLoader(this)`) pada saat `Application.onCreate()` dan memperbarui direktori disk cache ke `image_cache_v3` untuk membersihkan cache 403 sebelumnya.
               - Menambahkan mapping fallback cerdas `.takeIf { it.isNotBlank() }` serta alias Gson (`alternate`) pada model data `AnimeItem`, `CuplixItem`, `MovieDetail`, `SeasonItem`, dan `EpisodeItem` sehingga seluruh aset gambar poster, cover, dan thumbnail muncul 100% bersamaan dengan gambar komik.

            2. **Fitur On/Off Efek Liquid Glass pada Floating Bottom Navbar:**
               - Sistem deteksi default otomatis sesuai versi OS Android (`Build.VERSION.SDK_INT`):
                 - Android 13+ (API 33+ / TIRAMISU): Default **ON (`true`)**.
                 - Android 12- (API 32 ke bawah): Default **OFF (`false`)**.
               - Bentuk, posisi mengambang (*floating*), ukuran, padding, dan tata letak tab aktif (Ikon + Judul) & inaktif (Ikon saja) tetap 100% identik baik saat ON maupun OFF.
               - Saat ON: Efek optik *Liquid Glass* penuh (live backdrop refraction, lensing edge, chromatic dispersion, frosted glass shader).
               - Saat OFF: Perhitungan shader dan penangkapan layer dimatikan untuk performa sangat ringan dan hemat baterai, digantikan permukaan gelap semi-transparan yang bersih dan elegan (`#D912141A` luar dan `#26FFFFFF` aktif dengan border `#33FFFFFF`).
               - Toggle switch real-time di `SettingsScreen` (Pengaturan) bagian `NAVIGASI & TAMPILAN` ("Efek Liquid Glass Navbar").
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
