name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.0.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Liquid Glass Navbar, Dynamic Spotlight Onboarding, 2-Kolom Komik & Fix Zoom Cari (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Peningkatan Utama:
            1. **Redesign Floating Bottom Navigation Bar dengan Gaya "Liquid Glass":**
               - Mengambang elegan di atas konten layar dengan margin aman dan padding navigasi sistem.
               - Kapsul utama berpenampilan kaca cair gelap transparan (`#11141B`) dengan rim highlight fresnel specular di bibir atas dan bias chromatic dispersion halus.
               - **Tab Aktif:** Dilingkupi kapsul lensa Liquid Glass beraksen oranye khas Yuranime dengan efek pegas dinamis (*spring physics: squash and stretch*), menampilkan Ikon Solid + Teks Judul SF Bold di sebelah kanan.
               - **Tab Tidak Aktif:** Hanya menampilkan Ikon Outline abu-abu kebiruan tanpa teks judul sama sekali, dengan touch target 48dp sesuai standar aksesibilitas R-03.

            2. **Perbaikan Total Koordinat Spotlight Onboarding (Dynamic Measurement):**
               - Menghapus 100% koordinat persentase/offset tebakan yang sebelumnya meleset dari komponen asli.
               - Menggunakan `Modifier.onGloballyPositioned` dan `coordinates.boundsInRoot()` secara real-time di semua layar (Home, Detail Anime, Streaming Player, dan Search).
               - Auto-scroll LazyList secara mulus ke posisi elemen sebelum menggambar sorotan (misalnya section Komik di Home).
               - Posisi Kartu Petunjuk (Tooltip Card) dinamis otomatis: berada di bawah elemen jika target di paruh atas layar, dan berada di atas elemen jika target di paruh bawah layar sehingga tidak pernah menutupi konten yang disorot.

            3. **Tata Letak Komik Terbaru Grid 2 Kolom (Total 8 Poster):**
               - Menggantikan slider geser samping dengan susunan grid 2 kolom ke bawah (4 baris x 2 kartu = total 8 komik).
               - Poster komik vertikal (62dp, 2:3) tampil bersih murni tanpa ada lapisan overlay gelap di belakangnya.
               - Sisi kanan kartu memuat judul SF Bold putih 12sp, bendera asal negara (China, Jepang, Korea), dan 3 baris chapter terbaru dengan waktu rilis relatif rapat dan presisi.

            4. **Perbaikan Bug Gambar Kategori & Tahun di Halaman Cari (`CARI`) yang Nge-Zoom:**
               - Mengunci ukuran kartu tetap di 90dp dengan decode size `coil.size.Size.ORIGINAL` dan `crossfade(false)`.
               - Menggunakan `ContentScale.FillHeight` sehingga gambar banner karakter tidak pernah melompat atau nge-zoom sendiri saat layar diam maupun saat di-scroll.

            5. **Kepatuhan Desain Anti-Slop (Delivery Gate):**
               - Bebas gradasi biru-ungu generik dan bebas karakter em dash pada teks UI.
               - Target sentuh minimum 44dp-48dp dan penanganan UI states lengkap.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
