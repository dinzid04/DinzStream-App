name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.9.9"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Integrasi Komik Real-Time, Spotlight Onboarding, Perbaikan Login Google & Banner Search (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **Integrasi Scrape Komik Real-Time di Halaman Home:**
               - Menggantikan section `Judul Baru` dengan **Komik Terbaru** bersumber langsung dari scraper shngm/komikid.
               - Header asli Yuranime dengan teks putih tebal SF Bold dan tombol bulat chevron kanan tanpa garis merah kaku.
               - Kartu komik permukaan gelap halus `#141418` (radius 12dp) dengan poster vertikal 2:3, judul tebal SF Bold, bendera negara asal (Manhua China, Manga Jepang, Manhwa Korea), dan 3 chapter terbaru rapat presisi (titik oranye `#FF5722` + waktu rilis relatif).
               - Halaman detail komik lengkap (`ComicDetailScreen`) dan pembaca gambar chapter webtoon vertikal (`ComicReaderScreen`).

            2. **Fitur Petunjuk Pemula Interaktif (Spotlight Coachmark):**
               - Panduan interaktif visual bagi pengguna baru dengan overlay semi-transparan `#CC000000` dan sorotan berbingkai border menyala merah-oranye `#EF4444` / `#FF5722`.
               - Kartu petunjuk (#16181D, border #2A2E37, radius 16dp) dengan judul SF Bold, penjelasan ramah pemula, indikator titik progres kapsul, tombol `Skip`, `Previous`, dan `Next / Selesai`.
               - Mencakup halaman Home, Detail Anime, Search (Cari), dan Pemutar Video Streaming.

            3. **Perbaikan Total Login Google & Panduan `FIREBASE_SETUP.md`:**
               - Menghapus dialog popup fallback ungu; pengguna login langsung dengan akun Google asli mereka.
               - Mengatasi exception `[ INVALID_APP_ID ]` dengan dual-session cerdas yang langsung menyimpan sesi `GoogleSignInAccount` dan menyinkronkan dokumen profil ke Firestore `users/{googleId}` secara real-time tanpa error toast.
               - Menyertakan dokumen panduan `FIREBASE_SETUP.md` di root project lengkap dengan nilai SHA-1, SHA-256, dan langkah penambahan aplikasi di Firebase Console.

            4. **Perbaikan Gambar Banner Karakter di Halaman Search (`CARI`):**
               - Menyesuaikan proporsi tinggi kartu ke 92dp sesuai rasio banner asli 3:1 (600x200).
               - Mengatur alignment `CenterEnd` untuk `KATEGORI` dan `KARAKTER` sehingga wajah karakter di sisi kanan terlihat utuh dan jelas tanpa terpotong.
               - Mengatur alignment `CenterStart` untuk `TAHUN` sehingga ilustrasi karakter di sisi kiri terlihat utuh dan tidak terpotong.

            5. **Kepatuhan Desain Anti-Slop (Delivery Gate):**
               - Bebas gradasi biru-ungu generik dan bebas karakter em dash pada teks UI.
               - Target sentuh minimum 44dp-48dp dan UI states lengkap.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
