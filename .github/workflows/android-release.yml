name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v1.9.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v1.9.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v1.9.0.apk \;
          fi
          ls -lh build-output/Yuranime-v1.9.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v1.9.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.9.0-build-${{ github.run_number }}"
          name: "Yuranime v1.9.0 - Home Slider, Logo Animation, Cinematic Login & Cuplix Randomizer (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.9.0 Release

            ### Pembaruan Utama:
            1. **Perubahan UI Home Slider & Animasi Logo:**
               - Hero Slider gaya baru dengan poster vertikal di sisi kiri, judul bold uppercase, sinopsis rapi, tombol CTA "TONTON SEKARANG" merah Yuranime, dan indikator paginasi horizontal.
               - Header Logo Animasi (`YuranimeAnimatedLogo`) dengan transisi busur merah rotasi 360° saat layar dimuat serta efek sentuhan mikro (spring bounce + arc rotation).
            2. **Pembaruan Halaman Login (Profile):**
               - Tampilan login sinematik dengan latar belakang 3 kolom poster anime tilted yang scrolling vertikal offline dari 12 poster lokal di drawable.
               - Tombol masuk bersih "Masuk dengan Google" berikon vector resmi dan tombol "Login Tester".
               - Tampilan profil pengguna dengan avatar berputar 60fps (`AnimatedAvatarBorder`), pemilih preset border bergerak (Kitsune Flame, Neon Cyberpunk, Celestial Gold, Sakura Bloom, Void Abyss), riwayat tontonan lokal, dan opsi keluar akun.
            3. **Perbaikan Randomisasi Cuplix:**
               - Fungsi `getRandomizedCuplixFeed` cerdas yang menggabungkan feed populer dan terbaru serta melakukan pengacakan dinamis (shuffled).
               - Memastikan klip yang diklik tetap diputar instan di index 0, sementara sisa feed dan baris avatar Cuplix di Home/Jadwal selalu menampilkan anime yang bervariasi.
            4. **Perubahan Package Name (`com.yuranime.dinz`):**
               - Migrasi seluruh namespace, applicationId, manifest, struktur direktori kode, dan ProGuard menjadi `com.yuranime.dinz`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v1.9.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
