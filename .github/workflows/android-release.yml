name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.9.8"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Desain Presisi Ultah Hari Ini, 2 Mode Hero Slider & Halaman Pengaturan (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **Desain Presisi Ulang Tahun Hari Ini (Home & Detail Karakter 100% Sesuai Referensi):**
               - **Home Section:** Header teks `Ulang Tahun Hari Ini • [Tanggal]` dengan tombol navigasi lingkaran gelap. Kartu potret (115dp, rasio 2:3, radius 12dp, tanpa border) dengan gradasi bawah halus, tanggal oranye `#FF5722` SF SemiBold, dan nama putih SF Bold.
               - **Detail Karakter (`CharacterDetailScreen`):** Backdrop gradasi gelap menyatu ke latar `#0B0B0B`, tombol kembali bulat 40dp, foto profil potret (135dp, rasio 2:3 tanpa border), label abu-abu `#94A3B8` sejajar foto.
               - **Deskripsi & Biodata:** Deskripsi nyaman dengan tombol lipat/buka `Selengkapnya... ⌄` oranye. Biodata tersusun dalam 2 kolom bersih tanpa kotak/border garis.
               - **Seiyuu & Daftar Anime:** Avatar seiyuu bulat (54dp) dengan label `Bahasa: Jepang` oranye. Daftar anime bersih dengan thumbnail persegi membulat (56x56dp), peran karakter oranye, status, dan navigasi langsung ke detail anime.

            2. **2 Mode Tampilan Hero Slider Beranda:**
               - **Mode 1 - Default Slider (Bawaan):** Mempertahankan tampilan slider dengan kartu poster di pojok kiri bawah, sinopsis, tombol `TONTON SEKARANG`, dan indikator slide.
               - **Mode 2 - Clean Cover Slider:** Tampilan bersih sesuai gambar referensi dengan cover layar penuh tanpa poster kecil di kiri bawah, tipografi judul all-caps `Yuranime-logo-font.ttf`, sinopsis singkat, tombol kapsul putar merah `▶ TONTON SEKARANG`, indikator titik pagination, dan ikon pencarian di kanan atas banner.

            3. **Halaman Pengaturan (`SettingsScreen`) & Penyimpanan Preferensi:**
               - Akses menu `Pengaturan` dari halaman Profil dan tombol cepat.
               - Pilihan radio interaktif untuk beralih mode slider Beranda yang tersimpan permanen di `SharedPreferences` / `AppPreferences`.
               - Pengaturan putar otomatis episode berikutnya, fitur bersihkan cache gambar, dan cek pembaruan aplikasi.

            4. **Kepatuhan Desain Anti-Slop:**
               - Menggunakan warna kanvas presisi (`#0B0B0B`), permukaan profil (`#0E0F12`), dan kartu (`#161820`).
               - Bebas garis border norak dan ruang kosong terbuang.
               - Target sentuh minimum 48dp dan tidak ada karakter em dash pada UI text.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
