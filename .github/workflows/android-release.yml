name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/AnimeIn-v1.3.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/AnimeIn-v1.3.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AnimeIn-v1.3.0.apk \;
          fi
          ls -lh build-output/AnimeIn-v1.3.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeIn-APK
          path: build-output/AnimeIn-v1.3.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.3.0-build-${{ github.run_number }}"
          name: "AnimeIn App v1.3.0 - Overhaul Streaming & Home + Jadwal & Search (Build #${{ github.run_number }})"
          body: |
            ## AnimeIn Android App v1.3.0 Release
            - **Perombakan Presisi Halaman Streaming (Custom Video Player):**
              - Player Controls dengan tombol tengah Emerald Green (`#00C853`) diapit skip 10s backward & forward.
              - Seekbar hijau emerald (`#00C853`), durasi waktu `01:44 / 23:49`, dan orientasi otomatis landscape.
              - Tombol `Menu v` di pojok kanan atas player untuk memilih server dan resolusi video.
              - Info di bawah player: `Episode [N]`, Judul Anime putih tebal (20sp), Sinopsis 3 baris (menghapus 2 kotak besar SERVER & LOVE IT).
              - Section `COVER & POSTER`: Badge segitiga oranye `▲` dan jumlah poin `44 P` pada sisi poster.
              - Floating Action Button (FAB) chat tosca di pojok kanan bawah dengan input bar komentar mengambang.
              - Layar penuh `Balasan` dengan pinned parent comment dan avatar animasi Pokémon GIF via Coil `GifDecoder`.
            - **Perombakan Presisi Halaman Home:**
              - `Lanjut Nonton` menggunakan kartu vertikal (2:3) dengan nomor episode, judul tebal, serta baris Views & Favorites.
              - `Cuplix` berbentuk **squircle** (rounded rectangle membulat halus), bukan lingkaran bulat ber-border kaku.
              - `Episode Baru` menampilkan nomor episode dinamis asli (`Episode 7`, `Episode 5`, dll).
              - `Paling Dinanti` menyembunyikan metrik views (`0 views`), hanya tanggal rilis kalender biru & favorites.
              - `Jadwal Hari Ini` menampilkan countdown / jam tayang rilis baru ungu (`🕒 new !!`).
              - Section `Jas Por Yu` dan `Baca Manra`.
              - Bottom Navigation Bar 5 tab: `HOME`, `JADWAL`, `CARI`, `CHAT`, `PROFILE`.
            - **Fitur Baru: Halaman Jadwal (`JadwalScreen`):**
              - Tab hari scrollable: `SEN`, `SEL`, `RAB`, `KAM`, `JUM`, `SAB`, `MIN`.
              - Baris cuplix squircle horizontal.
              - Kartu jadwal anime lengkap dengan poster 2:3, genre, judul, sinopsis, views, favorites, dan countdown rilis (`time`).
            - **Fitur Baru: Halaman Search / Explore (`SearchScreen`):**
              - Search bar dengan pill shape dan auto-debounce search.
              - Mode Default Explore: Kategori kartu putih dengan ilustrasi karakter anime, Studio pill chips, Tahun cards, Tipe chips, dan Karakter dark cards.
              - Mode Hasil Pencarian: Horizontal genre chips, cuplix squircle, daftar kartu hasil pencarian, tombol toggle Grid (3 kolom) vs List, serta tombol sort.
            - **Navigasi Global & BackHandler:**
              - Tab switching lancar antara `HOME`, `JADWAL`, dan `CARI` dengan transisi mulus ke `AnimeDetailScreen` dan `StreamingScreen`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/AnimeIn-v1.3.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
