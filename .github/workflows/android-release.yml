name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v1.6.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v1.6.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v1.6.0.apk \;
          fi
          ls -lh build-output/Yuranime-v1.6.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v1.6.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.6.0-build-${{ github.run_number }}"
          name: "Yuranime v1.6.0 - Full-Bleed Notch Fix, Cuplix Reels Viewer, Search Filters & Popular Leaderboard (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.6.0 Release

            ### 🚀 Fitur & Peningkatan Utama:
            1. **Video Player Imersif & Notch Cutout Fix (`MainActivity` & `StreamingScreen`):**
               - Full-bleed status bar transparan menembus batas layar (`WindowCompat.setDecorFitsSystemWindows(window, false)` & `layoutInDisplayCutoutMode = SHORT_EDGES / ALWAYS`).
               - Sembunyikan system bars secara imersif pada mode fullscreen / landscape dengan swipe transient (`WindowInsetsControllerCompat`).
               - Overlay kontrol atas (`<-` dan `⚙`) tidak lagi terpotong notch kamera atau bar hitam.
            2. **Halaman Search / Cari (`SearchScreen`):**
               - Kartu `KATEGORI`, `TAHUN`, dan `KARAKTER` diperlebar menjadi tinggi `114.dp` dengan `alignment = Alignment.TopCenter` sehingga ilustrasi dan kepala karakter utuh tanpa terpotong.
               - Integrasi filter klik langsung pada kartu Kategori (genre), Tahun, Studio, Tipe, dan Karakter ke halaman hasil pencarian.
               - Fitur **Pull-to-Refresh** dengan pengacakan (`.shuffled()`) dinamis pada item kategori, tahun, studio, dan karakter.
            3. **Halaman View Cuplix & Komentar Cuplix (`CuplixViewScreen`):**
               - Tampilan video reels layar penuh vertikal tanpa seekbar/durasi/slider kecepatan.
               - Menu titik tiga (`⋮`) di kanan atas dengan pop-up pemilihan resolusi (360p, 480p, 720p, 1080p) tersinkronisasi.
               - Tap to Pause/Play dengan animasi tombol play transparan di tengah.
               - Creator info: avatar pokemon showdown bulat border oranye, username oranye `#FF5722`, caption, kapsul judul anime oranye (`wrapContentWidth`), dan kapsul episode gelap.
               - Action sidebar kanan: tombol Like hati dengan counter, tombol Komentar dengan counter, dan poster mini anime.
               - Bottom sheet komentar Cuplix dengan input rounded dan fetch komentar asli.
            4. **Paling Populer di Home (`HomeScreen` & `PopularLeaderboardCard`):**
               - Daftar peringkat vertikal Top 1-10 bergaya leaderboard kartu gelap `#0F1420`.
               - Ranks 1–3 dengan garis lengkung aksen emas di tepi kiri, angka miring (*italic*) SF Bold emas `34.sp`, 5 bintang emas (`★★★★★`) dan jumlah favorit pengguna (`favorites`).
               - Ranks 4–10 dengan angka timbul gelap dan border minimalis.
               - Artwork anime cover di sisi kanan dengan masking gradasi horizontal memudar alami ke latar kartu.
            5. **Rebranding Total ke Yuranime & Global SVG Placeholder:**
               - Nama aplikasi dan identitas visual diperbarui ke **Yuranime**.
               - Ikon peluncur adaptif baru (`ic_launcher`) berbasis logo geometris kitsune.
               - Placeholder vektor global (`placeholder_yuranime.xml` & `placeholder_yuranime_wide.xml`) pada seluruh gambar aplikasi.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v1.6.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
