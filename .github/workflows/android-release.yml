name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.1.1"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix AnimeIn & Komik Images 100%, Navbar Liquid Glass On/Off Toggle (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Perbaikan Utama:
            1. **Perbaikan Gambar AnimeIn & Komik Muncul 100% Bersamaan:**
               - Mengisolasi header interceptor di dalam OkHttpClient Coil ImageLoader berdasarkan host/domain URL request. Domain komik mendapatkan header `Referer` (`https://app.shinigami.asia/`) dan `User-Agent` browser, sedangkan domain AnimeIn (`animein.net`, `xyz-api.animein.net`) tidak menerima header Referer komik dan menggunakan `User-Agent` serta `x-proxy-secret` resmi AnimeIn.
               - Menghapus proxy mati `cf1.dinzid.my.id/?url=` pada fungsi `normalizeImageUrl` dan membersihkan normalisasi URL gambar AnimeIn sehingga seluruh gambar di Hero Slider, Cuplix, Episode Baru, Sedang Hangat, Jat For Yu, Paling Dinanti, Jadwal, dan Detail Anime tampil 100% lancar bersamaan dengan Komik Terbaru.

            2. **Fitur On/Off Efek Liquid Glass pada Floating Bottom Navbar:**
               - Sistem deteksi default otomatis sesuai versi OS Android (`Build.VERSION.SDK_INT`):
                 - Android 13+ (API 33+ / TIRAMISU): Default **ON (`true`)**.
                 - Android 12- (API 32 ke bawah): Default **OFF (`false`)**.
               - Bentuk, posisi mengambang (*floating*), ukuran, padding, dan tata letak tab aktif (Ikon + Judul) & inaktif (Ikon saja) tetap 100% identik baik saat ON maupun OFF.
               - Saat ON: Efek optik *Liquid Glass* penuh (live backdrop refraction, lensing edge, chromatic dispersion, frosted glass shader).
               - Saat OFF: Perhitungan shader dan penangkapan layer dimatikan untuk performa sangat ringan dan hemat baterai, digantikan permukaan gelap semi-transparan yang bersih dan elegan (`#D912141A` luar dan `#26FFFFFF` aktif dengan border `#33FFFFFF`).
               - Toggle switch real-time baru di `SettingsScreen` (Pengaturan) bagian `NAVIGASI & TAMPILAN` ("Efek Liquid Glass Navbar").
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
