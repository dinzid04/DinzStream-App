name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.8.2"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Telegram CDN (Animated GIF/WebP/Video Profile & Banner) & Fix Custom Title Alignment (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **CDN Telegram + Cloudflare Worker (`yuranime-tg-cdn`):**
               - Menghapus total ketergantungan pada `dinzid` CDN & Catbox untuk upload avatar, cover banner, bingkai Top 1-3, dan aset maskot komik.
               - Upload permanen langsung tersimpan ke channel Telegram via Cloudflare Worker dengan cache global 1 tahun (`Cache-Control: immutable`).
            2. **Support Avatar & Banner Bergerak (GIF, WebP Animasi, Video-to-GIF):**
               - Pemilih galeri di Edit Profil kini mendukung foto statis, GIF, WebP animasi, dan file video (`.mp4`/`.mov`/`.webm`).
               - File video otomatis dikonversi langsung di perangkat menjadi Animated GIF loop sebelum pratinjau dan upload, sementara file GIF/WebP animasi dipertahankan tanpa merusak frame geraknya.
            3. **Perbaikan Posisi Teks Custom Title Badge:**
               - Menghilangkan `fontPadding` bawaan dan `lineHeight` berlebih pada `GeometricTitleBadge`, `SleekChamferedMicroTag`, dan `SleekHexChevronLevelTag` sehingga teks judul presisi di tengah bingkai poligon dan aman dari potongan sudut kanan.
               - Merapikan dialog **Pilih Custom Title** agar semua lencana sejajar rata kiri tanpa distorsi skala.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
