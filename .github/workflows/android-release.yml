name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v1.8.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v1.8.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v1.8.0.apk \;
          fi
          ls -lh build-output/Yuranime-v1.8.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v1.8.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.8.0-build-${{ github.run_number }}"
          name: "Yuranime v1.8.0 - Streaming Info Card, Monochrome Placeholder, App Icon & 60fps Motion Splash (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.8.0 Release

            ### Pembaruan Utama:
            1. **Halaman Streaming - Kontainer Info Anime (`#12151C`):**
               - Kontainer kartu `#12151C` (`12.dp` rounded) di bawah Video Player dan di atas `COVER & POSTER`.
               - Baris atas: Poster vertikal (`2:3`, `80.dp`) di sisi kiri, serta Judul Anime (**SF Bold** putih) dan baris metadata (`Episode [Nomor]`, ikon mata + views singkat, dan kondisional `airedStart` dengan pemisah `•` hanya jika tanggal tersedia) di sisi kanan.
               - Baris bawah: Sinopsis anime (`#94A3B8`, default 3 baris) dengan tombol interaktif `Selengkapnya >` / `Sembunyikan` berwarna biru (`#3B82F6`) untuk membuka atau menutup sinopsis penuh.
            2. **Global SVG Placeholder (`yuranime-monochrome.svg`) & Launcher Icon (`yuranime-app-icon.svg`):**
               - Konversi `yuranime-monochrome.svg` ke VectorDrawable `ic_yuranime_monochrome.xml`, `placeholder_yuranime.xml`, dan `placeholder_yuranime_wide.xml` di seluruh komponen `AsyncImage`.
               - Pembaruan ikon aplikasi utama (`ic_launcher`, `ic_launcher_round`, adaptive foreground & background) menggunakan `yuranime-app-icon.svg`.
            3. **Motion Graphics Splash Screen 60fps (`yuranime-full-logo.svg` + `Calistoga Regular`):**
               - Ekstraksi layer independen: Segitiga Play Putih, Dua Busur Lingkaran Merah, Siluet Kepala Serigala/Rubah Putih, dan teks `Yuranime` (`yuranime_logo_font.ttf`).
               - Sekuens 4 tahap (0ms - 2600ms) dengan preloading data Home di background dan transisi crossfade + scale menuju `HomeScreen`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v1.8.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
