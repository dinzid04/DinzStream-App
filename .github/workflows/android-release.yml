name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk DinzStream-v1.0.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk DinzStream-v1.0.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} DinzStream-v1.0.0.apk \;
          fi
          ls -lh DinzStream-v1.0.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DinzStream-APK
          path: DinzStream-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.0.0-build-${{ github.run_number }}"
          name: "DinzStream App v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## DinzStream Android App Release v1.0.0
            - Automated native Android build from commit `${{ github.sha }}`
            - Built with Kotlin, Jetpack Compose, and Material 3
            - Integrated with AnimeIn and Cuplix APIs
            - Anti-slop clean dark UI architecture
            
            **Download and install the APK below:**
          draft: false
          prerelease: false
          make_latest: true
          files: |
            DinzStream-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
