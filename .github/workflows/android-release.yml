name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.5.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Halaman Baca Komik, Unduh Offline & Apple Design (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Fitur Baru:
            1. **Halaman Baca Komik (ComicReaderScreen) & Apple Design:**
               - Header atas semi-transparan dengan tombol kembali, judul komik, dan kapsul pemilih chapter (`Ch. X ⌄`).
               - Kontrol bawah minimalis dengan 3 tombol bulat elegan: Pengaturan Pembaca, Play/Pause Auto-Scroll instan, dan Daftar Chapter.
               - Navigasi halaman bawah: Tombol prev/next chapter + kapsul panjang dengan slider progres halaman interaktif langsung melompat ke halaman komik.
               - Bottom Sheet Daftar Chapter dengan indikator chapter aktif dan auto-scroll.
               - Bottom Sheet Pengaturan Pembaca: Toggle mode Webtoon vs Per Halaman (dengan pinch-to-zoom), kualitas gambar Tinggi vs Rendah, slider sinkronisasi kecerahan layar HP secara real-time, dan kecepatan auto-scroll 1x hingga 5x.
               - Auto-Save riwayat baca dan posisi scroll terakhir secara real-time.

            2. **Sistem Unduh Chapter Offline di Memori Internal App:**
               - Penggantian ikon `>` di tab CHAPTER `ComicDetailScreen` menjadi tombol Unduh Chapter interaktif.
               - Gambar chapter disimpan secara privat dan aman di `context.filesDir/offline_comics/` (tidak memenuhi galeri).
               - Tampilan progres unduhan dan ikon ceklis terunduh dengan opsi hapus unduhan.
               - Komik yang telah terunduh dapat dibaca 100% offline tanpa internet.
               - Manajemen unduhan komik terintegrasi di layar Unduh pada menu Profile dengan informasi ukuran memori.

            3. **Wajib Skeleton Shimmer (Bebas Circular Loading):**
               - Mengganti seluruh loading putar `CircularProgressIndicator` pada gambar komik, halaman baca, dan pencarian dengan Skeleton Shimmer mengkilap elegan + logo monokrom Yuranime.

            4. **Perbaikan Error 432 & Fallback Mirror Scraper:**
               - Normalisasi ID dan slug komik dari Home Anime.
               - Header anti-bot modern (User-Agent Pixel 8 Pro, Sec-CH-UA, Referer, Accept-Language, Origin).
               - Automatic fallback mirror antara komikid dan KomikStation sehingga komik selalu berhasil dimuat tanpa error 432.

            5. **Perbaikan Warna Banner Bawah & Auto-Slide Hero Slider:**
               - Warna container banner newsletter menyatu sempurna dengan background utama `#0B0B0B`.
               - Auto-slide hero slider setiap 4500ms dengan animasi spring physics Apple Design yang halus.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
