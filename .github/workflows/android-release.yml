name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "4.0.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Run RPG Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Sakura Vale Anime Cozy Sandbox RPG (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Besar v${{ env.APP_VERSION }} (Sakura Vale: Anime Cozy Sandbox RPG):
            1. **Overhaul Total Aset Pixel-Art Anime 16-bit CC0 (100% Offline):**
               - Mengganti seluruh aset game dengan paket CC0 Ninja Adventure (Pixel-Boy & AAA) yang serasi: 8 preset protagonis anime + potret wajah, 8 warga desa hidup, 5 hewan desa, 9 tileset HD pixel-art, air terjun & kincir angin beranimasi, 16 spesies ikan, 6 tanaman (5 tahap), 6 mineral tambang, 14 furnitur/dekorasi, 13 hidangan anime, 5 musik OGG adaptif, dan 17 efek suara WAV.
            2. **Dunia Multi-Wilayah 80x64 + 6 Interior & Gua yang Bisa Dimasuki:**
               - 13 wilayah terhubung (Homestead, Lahan Pertanian, Alun-Alun, Pasar, Permukiman, Danau Bisikan, Lembah Sungai, Hutan Rimba, Pantai Samudra, Pegunungan Utara, Gua Kristal, Hutan Sakura Rahasia Lv.2, Reruntuhan Kuno Lv.3).
               - 6 peta interior/gua nyata dengan transisi halus: Rumah Petualang (tidur, dapur, meja kerja, peti), Toko Hana, Kedai Teh Sakura, Bengkel Kenji, Pendopo Tetua Haru, dan Gua Kristal Tambang.
            3. **Kontrol Mobile RPG Profesional:**
               - Mode Hybrid, Joystick Saja, atau Ketuk-Jalan Saja dengan A* Pathfinding nyata dan interaksi kontekstual otomatis saat mengetuk warga, pohon, batu tambang, air, kebun, atau pintu.
               - Pengaturan lengkap joystick (Tetap/Mengambang, Kiri/Kanan, ukuran, transparansi, sensitivitas) tersimpan otomatis.
            4. **Desain Ulang Total Antarmuka RPG & Simulasi Desa Hidup:**
               - UI bergaya kayu cedar & perkamen JRPG dengan potret wajah anime, sistem energi, 6 keahlian hidup, memasak, kerajinan, dekorasi dalam/luar rumah, jadwal harian 8 NPC + hati persahabatan + hadiah, serta Peta Dunia interaktif.
            5. **Tetap Aman, Login-Only & Sinkron Cloud Akun:**
               - Tetap eksklusif untuk akun login, tersimpan per-UID di Room v3 dan tersinkron otomatis ke Firebase Firestore akun login (kompatibel mundur dengan save v2).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
