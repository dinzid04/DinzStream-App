name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.1.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Pure Clear Liquid Glass Navbar, Comic Detail Vortex, 10-Komik Clean Grid & Unified Search Cards (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Perbaikan Utama:
            1. **Floating Bottom Navbar Murni & Clear Liquid Glass (`quickLiquid` AGSL):**
               - Dilepaskan sepenuhnya dari `Scaffold(bottomBar)` sehingga tidak ada lagi blok hitam di bawah kapsul dan konten halaman mengalir penuh 100% di belakang kaca navbar.
               - Menggunakan `GraphicsLayer` + AGSL `RuntimeShader` (Android 13+) dengan *clear center*, *refractive lensing edge*, *chromatic dispersion*, dan *fresnel specular rim* putih `1.dp`.
               - Kapsul tab aktif kini menggunakan lensa kaca bening putih bersih (tanpa warna coklat/merah keruh) dengan Ikon Putih Solid + Teks Judul Putih SF Bold, sedangkan tab tidak aktif hanya menampilkan Ikon Outline.

            2. **Perbaikan Section `Komik Terbaru` di Home (Tanpa Kotak Overlay, 10 Item, Fix Poster & 3 Chapter Sejajar):**
               - Menghapus kotak/border abu-abu (`#141418`) di belakang setiap item komik sehingga poster dan teks tampil bersih langsung di atas latar utama (`#0B0B0B`).
               - Menampilkan 10 komik terbaru (5 baris x 2 kolom).
               - Memperbaiki pemuatan gambar poster komik dengan fallback `cover_image_url` dan header HTTP (`User-Agent` & `Referer`).
               - Mengunci tinggi judul menjadi 2 baris (`minLines = 2, maxLines = 2`) dan menjamin 3 chapter terbaru selalu tampil utuh serta sejajar rata horizontal antara kolom kiri dan kanan.

            3. **Perbaikan Kartu `KATEGORI` & `TAHUN` di Halaman Cari (`CARI`) Tanpa Pembatas Warna:**
               - Mengekstrak warna latar piksel tepi gambar secara otomatis (`getPixel`) sebagai warna latar penuh kartu disertai *smooth horizontal gradient blend*, sehingga kartu menyatu penuh dari kiri ke kanan tanpa garis pembatas warna kaku.

            4. **Halaman Detail Komik Baru (`ComicDetailScreen` Gaya `Vortex`):**
               - Hero cover besar di bagian atas (tembus status bar) dengan tombol kembali, favorit, judul besar, jumlah views, dan jumlah suka sesuai hasil scrape.
               - Header tab melengkung (*curved arc header*) dengan 2 tab saja: `INFO` dan `CHAPTER` (tanpa `CAST` dan tanpa `Choice Mode`) disertai indikator garis bawah oranye (`#FF5722`).
               - Tab `INFO` menampilkan poster vertikal di kiri, `Title`, `Status` (oranye), `Type` + bendera negara, serta `Sinopsis`, `Kategori`, `Aired Start`, `Aired End`, dan `Author` dari hasil scrape.
               - Tab `CHAPTER` dilengkapi kolom pencarian chapter real-time dan daftar chapter vertikal dengan thumbnail persegi membulat, nomor `#01`, judul chapter, tanggal rilis, jumlah views, dan panah kanan `>` tanpa gembok.

            5. **Kartu `Lanjut Nonton` (Watch History) Horizontal Cover (`16:9`):**
               - Mengubah tampilan riwayat tontonan di halaman Home dari poster vertikal menjadi cover horizontal (`16:9`).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
