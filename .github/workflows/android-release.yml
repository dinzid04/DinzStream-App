name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.9.7"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Ulang Tahun Hari Ini OtakOtaku, Detail Ultah & Perbaikan Login Google (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **Fitur Tokoh Berulang Tahun Hari Ini (Integrasi OtakOtaku):**
               - Penempatan section di halaman Home tepat **di atas Cuplix** dan **di bawah Slider / Lanjut Nonton**.
               - Desain kartu horizontal modern dengan badge tipe `KARAKTER` & `SEIYUU / STAF`, shimmer loading state, dan tombol retry.
               - Halaman detail ulang tahun komprehensif: nama, kanji, alias, biodata detail (gender, tanggal lahir, golongan darah, tinggi/berat), deskripsi/biografi, profil pengisi suara, daftar peran suara seiyuu, dan daftar anime.
            2. **Perbaikan Autentikasi Google & Akun Terdaftar:**
               - Mengganti pemilih akun dasar dengan Google Sign-In native yang menampilkan profil lengkap (avatar, nama, email).
               - Menangani akun email yang sudah terdaftar sebelumnya dengan mulus melalui penautan kredensial Firebase otomatis.
               - Dukungan pemulihan kata sandi via email pada menu login.
            3. **Standar Desain Anti-Slop:**
               - Layout padat dan terarah tanpa ruang kosong terbuang.
               - Target sentuh minimum 48dp pada seluruh elemen interaktif.
               - Tanpa em dash pada UI text dan performa rendering optimal.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
