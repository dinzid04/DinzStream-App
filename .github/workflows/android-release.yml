name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.9.4"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Redesain Detail Anime Minimalis, 12 Komik Beranda & In-App Auto Update (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama v${{ env.APP_VERSION }}:
            1. **Redesain Halaman Detail Anime Sesuai Desain Minimalis:**
               - Cover hero dibuat lebih tinggi dan luas (355dp) dengan degradasi multi-stop halus yang menyatu langsung ke warna latar `#0B0B0B` tanpa garis batas.
               - Label `ONGOING` dan `SERIES` dipindahkan tepat di atas judul anime dengan tipografi minimalis tanpa overlay box dan tanpa shadow.
               - Top bar dibersihkan: tombol Back di kiri, Favorit & Share di kanan tanpa pill box, serta menghapus icon pensil/edit.
            2. **Bagian Komik Terbaru di Beranda (12 Komik ke Bawah):**
               - Menampilkan 12 komik (6 baris x 2 kolom) secara penuh ke bawah.
               - Poster komik dan daftar 3 chapter disinkronkan presisi menggunakan `IntrinsicSize.Min` dan `fillMaxHeight()` agar 100% sejajar rata horizontal.
               - Menyediakan cadangan fallback 12 komik lengkap dengan chapter & fallback KomikStation jika API utama terhambat.
            3. **In-App Updater Langsung & Mitigasi Google Play Protect:**
               - Ekstraksi tautan APK langsung dijamin valid tanpa redirect manual ke Chrome browser.
               - Pemasangan APK didukung flag `EXTRA_NOT_UNKNOWN_SOURCE`, `FLAG_ACTIVITY_CLEAR_TOP`, serta panduan resmi saat muncul verifikasi Google Play Protect.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
