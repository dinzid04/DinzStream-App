name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v1.9.1.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v1.9.1.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v1.9.1.apk \;
          fi
          ls -lh build-output/Yuranime-v1.9.1.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v1.9.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.9.1-build-${{ github.run_number }}"
          name: "Yuranime v1.9.1 - In-App Update Notice, New Login Experience & Profile Screen (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.9.1 Release

            ### Pembaruan Utama:
            1. **In-App Update Notification Popup (iOS Blurred Style + Full GitHub README & Image Renderer):**
               - Pengecekan otomatis versi semver saat aplikasi dibuka membandingkan versi lokal dengan rilis GitHub.
               - Dialog popup bergaya iOS Dark Frosted Glassmorphism dengan overlay hitam semi-transparan (`#CC1C1C1E` / `#D9242426`), border putih tipis `0.5.dp`, dan tipografi SF Bold & SF SemiBold.
               - Custom Markdown & GitHub README renderer yang merender gambar (`AsyncImage` dengan rounded corner `10.dp`), heading dengan aksen pembatas, bullet list titik bulat, blockquote dengan aksen oranye vertikal, format tebal, dan teks URL biru iOS (`#0A84FF`) yang bisa diklik.
               - Tombol aksi penuh bergaya iOS "Update Sekarang" yang langsung mengunduh/membuka file APK terbaru.
            2. **Perbaikan Total Halaman Login:**
               - Bottom Navigation Bar disembunyikan sepenuhnya saat pengguna berada di halaman login.
               - Tombol ikon panah kembali ke beranda di pojok kanan atas dengan jarak aman status bar.
               - Ikon rubah diperbesar dan berlatar belakang 100% transparan (tanpa bulatan hitam) serta digeser ke posisi sekitar 28%-32% dari atas layar.
               - Kolase poster bergerak lebih lambat, lebih rapat (`Arrangement.spacedBy(8.dp)`), dan True Seamless Infinite Loop (anti-glitch).
            3. **Pembuatan Halaman Profile Setelah Login:**
               - Header banner landscape anime dengan gradasi gelap menyatu ke latar utama (`#0E0F12`).
               - Foto profil bulat dengan border oranye tipis dan badge kamera biru di pojok kanan bawah.
               - Nama pengguna dengan ikon pensil edit serta teks level pengguna `Lv. 1`.
               - Baris scrollable tombol media sosial: WhatsApp (hijau), Telegram (biru), Instagram (pink), TikTok (putih), Discord (ungu-kebiruan).
               - 5 Menu profil bersih: Edit Profil (interaktif), Unduh, Papan Peringkat (TOP 100), Points & Rewards (★ 60), Info Cerita Kami (+ Cek Pembaruan), dan Keluar / Logout.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v1.9.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
