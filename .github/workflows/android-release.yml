name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.8.2"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Chat Global Real-Time, Stiker 2 Mode & Perbaikan Profil Login Google (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama:
            1. **Perbaikan Profil Login Google:**
               - Mencegah nama, foto profil R2/Telegram CDN, banner, bio, dan kosmetik pengguna tertimpa data bawaan Google saat logout dan login kembali.
            2. **Fitur Chat Global (`GlobalChatScreen`) & Preload Stiker Sticker.ly:**
               - Top header real-time dengan kehadiran `chat_presence` (maksimal 4 avatar online + `+N`), gelembung berekor modern dengan Avatar Decoration statis, Swipe-to-Reply WhatsApp, dan Context Menu Popover iOS.
               - Panel stiker 2 mode (Inline Emoji-Sticker 8-kolom sebaris dengan teks & Stiker Besar 4-kolom), pencarian cepat Sticker.ly, bar thumbnail sinkron 2 arah, serta manajemen paket default real-time dari Web Admin.
               - Upload foto/GIF chat langsung ke Telegram Worker CDN (maks 10 MB) dan Bottom Sheet Preview Profil teman dengan kosmetik animasi penuh.
          draft: false
          prerelease: false
          make_latest: false
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
