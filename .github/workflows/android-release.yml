name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.2.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Halaman Khusus Beranda Komik & Floating Liquid Glass Chooser (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Fitur & Pembaruan Utama:
            1. **Halaman Khusus Beranda Komik (`ComicHomeScreen`):**
               - Terintegrasi penuh dengan sumber data live scraper **`komikid`**.
               - **Hero Slider Komik:** `HorizontalPager` edge-to-edge dengan cover background vignette blur, judul UPPERCASE SF Bold putih 22-24sp, sinopsis 3 baris, tombol kapsul merah `▶ BACA SEKARANG` & tombol kaca `DETAIL`, poster komik 110dp di kanan, serta pagination dots aktif merah.
               - **Section `LANJUTKAN MEMBACA`:** Tampil kondisional berdasarkan riwayat baca lokal dari SQLite database dengan tombol cepat lanjutkan chapter.
               - **Section `TRENDING & POPULER`:** `LazyRow` komik populer lengkap dengan rating bintang emas dan ikon bendera negara.
               - **Section `RILISAN TERBARU`:** Grid 2 kolom x 6 baris (12 komik terbaru) dengan poster, judul, bendera, dan 3 chapter terbaru sejajar rapi.
               - **Section `TERPOPULER SEPANJANG MASA`:** Kolom geser horizontal berisi peringkat komik (3 komik per kolom) dengan angka peringkat besar 32sp (putih untuk 1-3, perak untuk 4+), bintang skor, dan jumlah views pembaca (e.g. `79,7jt`, `60,5jt`).

            2. **Fitur 2 Pilihan (Cari Anime vs Beranda Komik) pada Tombol Tengah Liquid Glass Bottom Navbar:**
               - 100% mempertahankan efek optik **Clear Liquid Glass** (AGSL RuntimeShader, chromatic dispersion, dan Fresnel rim).
               - **Floating Liquid Glass Chooser Pill:** Animasi spring physics halus yang melayang di atas tombol tengah navbar saat diklik untuk berpindah cepat antara `🔍 Cari Anime` dan `📖 Komik`.
               - Label dinamis: otomatis menampilkan ikon buku/komik dan teks **`Komik`** saat berada di Beranda Komik, dan **`Cari`** saat berada di Cari Anime.
               - Fitur pencarian komik real-time melalui ikon `🔍` di pojok kanan atas Beranda Komik.

            3. **Aset Bendera & Isolasi Referer OkHttpClient:**
               - Aset bendera negara `cn.webp`, `jp.webp`, `kr.webp` tersedia lokal di `res/drawable/` untuk performa instan tanpa delay jaringan.
               - Isolasi header request OkHttpClient Coil memastikan gambar anime AnimeIn dan komik komikid tampil sempurna tanpa bentrok WAF Cloudflare.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
