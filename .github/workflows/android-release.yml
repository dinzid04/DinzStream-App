name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "3.0.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Run RPG Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix Cover Komik, Hapus Maskot Chatroom & Willowbrook Cove Fishing RPG (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama v${{ env.APP_VERSION }}:
            1. **Perbaikan Cover Komik (Beranda Anime & Halaman Komik):**
               - Mengatasi API Shinigami HTTP 502 dengan sumber live KomikStation (`Rilisan Terbaru`, `Trending`, `Terpopuler`, `Cari & Filter`) serta mengganti seluruh cover fallback 404 dengan 12 cover terverifikasi.
               - Menyesuaikan rasio bingkai poster (`78dp x 112dp`, rasio `0.70`) dan `Alignment.TopCenter` agar poster komik tampil utuh tanpa terpotong dan tetap 100% sejajar dengan daftar chapter.
               - Menghapus maskot di bagian Chatroom Komunitas halaman Komik.
            2. **Game Baru: Willowbrook Cove (Cozy Fishing Life RPG) di Menu Profil:**
               - Mesin game 2D LibGDX (`OrthogonalTiledMapRenderer` + `starter_homestead.tmx` 30x24 dengan 8 layer) dan aset pixel-art 16-bit lokal lengkap (160 frame animasi karakter 4 arah, 64 tile, 12 spesies ikan, 3 spesies pohon, 4 tanaman 5 tahap tumbuh, 3 tingkat rumah, 12 furnitur, 14 audio).
               - Fitur lengkap: memancing dengan mini-game timing, tebang pohon & regenerasi, bertani & menyiram, mode konstruksi & upgrade rumah, toko & stasiun jual, inventaris, misi harian, pencapaian, siklus siang-malam, cuaca hujan, serta penyimpanan offline Room + DataStore.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
