name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.6.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Popup Promosi Dinamis, Web Admin & Bugfix UI (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Fitur Baru:
            1. **Sistem Popup Notifikasi Promosi Dinamis (PromoPopupDialog):**
               - 100% Sesuai gambar referensi `1002208488.jpg` dan kaidah Apple Design & Anti-Slop.
               - Latar belakang meredup dengan scrim hitam pekat 78% semi-transparan (`Color.Black.copy(alpha = 0.78f)`) dan animasi iOS spring scale + fade.
               - Tombol bulat Close (`✕`) berada di pojok kanan atas di luar gambar (jarak 8.dp dari poster).
               - Poster gambar murni (lebar 84% layar, rounded corner 14.dp, shimmer loading) tanpa teks atau kotak putih tambahan di bawah gambar.
               - Logika redirect opsional: jika `targetUrl` terisi di web admin, mengklik gambar langsung membuka browser. Jika kosong, bersifat gambar informatif.
               - Konfigurasi frekuensi & interval 8 jam real-time dari Firebase Firestore (`app_config/promo_popup`).
            
            2. **Website Admin Panel (promo-web-admin) — Vercel & Local Ready:**
               - UI Apple Dark Glassmorphism Obsidian Dark `#090A0F` dengan hairline border `1px solid rgba(255,255,255,0.08)`.
               - Form kontrol lengkap (iOS toggle switch, URL poster, target link, interval jam, max impressions).
               - Live interactive iPhone/Android mockup preview dengan simulasi 1:1.
               - Tombol `Simpan & Terapkan` dan `Push sebagai Promo Baru (Reset Cooldown User)`.
            
            3. **Perbaikan Poster Histori Baca ("Lanjutkan Membaca") di Halaman Komik:**
               - Metadata cover (`posterUrl` / `coverUrl`) selalu diteruskan ke `ComicReaderScreen` dan dilindungi dari penimpaan string kosong di SQLite database.
               - Kartu `Lanjutkan Membaca` merender cover dengan header Referer yang tepat sehingga poster 100% selalu muncul.

            4. **Perbaikan Posisi Header Chatroom & Maskot (1002209438.jpg):**
               - Menggabungkan teks `| CHATROOM KOMUNITAS` dan Maskot Anime ke dalam satu container header tepat di atas kotak putih Cbox.
               - Teks diletakkan di kiri bawah (10.dp di atas Cbox), dan Maskot di kanan bawah menempel di bibir kotak Cbox.
               - Mengurangi jarak kosong di bawah `RILISAN TERBARU` sehingga baris komik turun mendekat secara proporsional.

            5. **Perbaikan Auto-Slide Hero Slider (Anime & Komik):**
               - Auto-slide berjalan mulus setiap 4 detik menggunakan `pagerState.settledPage` dan `collectIsDraggedAsState()` dengan spring physics Apple.
               - Bekerja sempurna pada Mode Slider Default, Clean Cover Mode, dan Slider Beranda Komik.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
