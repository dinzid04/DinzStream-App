name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.1.3"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix 'Gagal Memuat Konten' & 100% AnimeIn + Komik Images (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Perbaikan Utama:
            1. **Perbaikan Error 'Gagal Memuat Konten' (Gson Deserialization Crash):**
               - Menghapus deklarasi kunci duplikat pada `@SerializedName` model data `AnimeItem` yang memicu `IllegalArgumentException: class com.yuranime.dinz.data.model.AnimeItem declares multiple JSON fields named poster`.
               - Seluruh endpoint API AnimeIn (`getHomeData`, `getHomeNewTitles`, `getHomeRandom`, `searchMovies`, `getCuplixFeed`) kini ter-parse 100% bersih dan konten beranda langsung muncul tanpa error.

            2. **Perbaikan Total Seluruh Gambar AnimeIn (Hero Slider, Cuplix, Episode Baru, Sedang Hangat, Jat For Yu, Paling Dinanti, Jadwal & Detail):**
               - Memperbaiki penanganan User-Agent pada Coil OkHttpClient: request gambar AnimeIn dikirimkan dengan User-Agent standar OkHttp (`okhttp/4.12.0`) tanpa header Referer asing, meloloskan tantangan bot Cloudflare WAF dengan status 200 OK.
               - Gambar komik tetap dikirim dengan `Referer: https://app.shinigami.asia/` dan User-Agent browser sehingga gambar anime dan komik tampil 100% secara bersamaan.
               - Mengaktifkan fallback gambar berantai cerdas (`imagePoster?.takeIf { it.isNotBlank() } ?: poster?.takeIf { it.isNotBlank() } ?: imageCover`) dan normalisasi path URL.

            3. **Fitur On/Off Efek Liquid Glass pada Floating Bottom Navbar:**
               - Deteksi default otomatis: Android 13+ (API 33+) default **ON (`true`)**, Android 12- (API 32-) default **OFF (`false`)**.
               - Desain kapsul mengambang (floating) dan struktur tab aktif/inaktif tetap 100% identik.
               - Toggle switch real-time di `SettingsScreen` (Pengaturan) bagian `NAVIGASI & TAMPILAN`.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
