name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v1.7.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v1.7.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v1.7.0.apk \;
          fi
          ls -lh build-output/Yuranime-v1.7.0.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v1.7.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v1.7.0-build-${{ github.run_number }}"
          name: "Yuranime v1.7.0 - Critical Bug Fixes: Search Filter System, Cuplix Autoplay & Like/Comment Sync (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v1.7.0 Release

            ### 🚀 Perbaikan Bug Kritis & Peningkatan Fitur:
            1. **Sistem Filter Search Terverifikasi AnimeIn APK (`classes7.dex`):**
               - Endpoint khusus: `/3/2/explore/movie_genre` (`id_genre`, `genre_in`), `/3/2/explore/movie_studio` (`studio`), `/3/2/explore/movie_type` (`type`), `/3/2/explore/movie_year` (`year`), dan `/3/2/explore/movie` (`keyword`).
               - Indikator Active Filter Chip di bagian atas dengan tombol `[✕]` untuk membatalkan filter secara elegan.
               - Menyembunyikan "Rekomendasi Populer" saat filter aktif sehingga daftar anime yang tampil benar-benar murni hasil filter yang diklik.
               - Mendukung pengurutan (`views`, `alphabet`, `new`), toggle tampilan Grid/List, serta pagination infinite scroll.
            2. **Sinkronisasi Like & Komentar Cuplix:**
               - Parsing field JSON asli: `@SerializedName("count_likes", alternate = ["likes", "like", "total_likes", "count_like"])` dan `@SerializedName("count_comments", alternate = ["comments", "comment", "total_comments", "count_comment"])`.
               - Sinkronisasi realtime `commentsCountMap` dan `likesCountMap` di `CuplixViewModel` dengan data detail komentar yang dimuat di background agar tidak pernah menampilkan angka `0` jika terdapat komentar riil.
            3. **Cuplix Seamless Autoplay & Zero-Black-Screen Crossfade:**
               - Video cuplix otomatis langsung berputar saat halaman aktif (`playWhenReady = true; prepare(); play()`).
               - Mengeliminasi kedipan layar hitam saat buffering/loading awal menggunakan `Player.Listener.onRenderedFirstFrame()` yang mempertahankan poster thumbnail menutupi `PlayerView` hingga frame video pertama siap, lalu melakukan transisi fade-out halus (`tween(300)`).
            4. **Interaksi Cuplix di Detail Anime (`AnimeDetailScreen`):**
               - Kartu Cuplix di tab CUPLIX kini sepenuhnya interaktif (`clickable { onCuplixClick(item.id) }`).
               - Navigasi tersambung langsung ke `CuplixViewScreen` di `MainActivity` sehingga pengguna dapat langsung memutar video cuplix yang dipilih dari halaman detail anime.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v1.7.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
