name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "2.8.0"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - All 985 Discord Borders & 396 Profile Effects, APNG 60FPS Decoder, Anibi 2-Column Grid, Fix HomeScreen JSON & Clean SF Pro Typography (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan & Fitur Baru (7 Instruksi Wajib):
            1. **Perbaikan Error JSON Beranda (HomeScreen):**
               - Semua instance Gson menggunakan `GsonBuilder().setLenient().serializeNulls().create()`.
               - Interceptor OkHttpClient membersihkan Byte Order Mark (BOM), memangkas spasi/teks sampah sebelum `{` atau `[`, auto-retry 2x, dan fallback cache otomatis sehingga beranda 100% langsung muncul tanpa error.
            2. **Tipografi Bersih SF Pro Display & Border Avatar Presisi:**
               - Menghapus total font tipis dan font monospasi bergaris nol `0` (`77.230 / 77.500`); kini menggunakan font sans-serif SF Pro Display bersih dan tegas.
               - Menghapus cincin EXP yang bertabrakan di foto profil; Avatar kini berukuran 82.dp dengan layer Border Avatar 100.dp (1.22x) tepat di tengah konsentris.
               - Menambahkan padding bawah 120.dp pada ProfileScreen agar tombol 'Keluar Akun' tidak tertutup bottom navbar.
            3. **Seluruh 985 Avatar Border & 396 Profile Effect Asli Discord:**
               - Menghapus 5 item dummy; membaca seluruh 985 Avatar Decorations dan 396 Profile Effects dari `discord_assets` JSON.
               - Pembagian tier otomatis: 15% Starter (500-1500 Poin), 65% Standard & High (3500-25000 Poin, Lv. 35+), 20% Mythic Limited (Eksklusif Redeem).
            4. **Animasi APNG 60 FPS & Disk Cache Instan:**
               - Mengintegrasikan library APNG decoder `com.github.penfeizhou.android.animation:apng:3.0.2` dengan komponen `AnimatedCosmeticImage` auto-start 60 FPS.
               - Optimasi URL `?size=160&passthrough=true` untuk loading instan dalam milidetik serta disk cache 250MB.
            5. **Katalog Lengkap di Halaman Edit Profil:**
               - Menampilkan seluruh 985 Border, 396 Profile Effect, dan Custom Title dengan item dimiliki di urutan teratas.
               - Memperbaiki bug double `@@` pada username.
               - Live preview instan di foto profil/banner atas saat item apa pun diklik.
            6. **Rombak Layout Shop, Rewards, & Leaderboard:**
               - Shop & Kosmetik: Desain Grid 2 Kolom gaya Anibi, search bar, filter chip, preview animasi 100.dp.
               - Points & Rewards: Menghapus kotak overlay tumpuk; header ramping 1 baris (`Lv. X • ✦ [Poin] Poin`), 7 kapsul streak check-in bersih emas/kristal, dan padding title 24.dp anti-terpotong.
               - Papan Peringkat: Menghapus kotak merah/abu podium; foto profil pas di lubang atas bingkai Top 1, 2, 3 konsentris (layer belakang zIndex=0, bingkai zIndex=1).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
