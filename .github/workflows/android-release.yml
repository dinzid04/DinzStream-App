name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "3.0.2"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Run RPG Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix TMX CSV Map Parser Willowbrook Cove RPG (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama v${{ env.APP_VERSION }}:
            1. **Perbaikan Error `Gagal memuat aset game: For input string: "4 4"` pada Willowbrook Cove RPG:**
               - Memperbaiki format CSV `<data encoding="csv">` pada seluruh 8 layer `starter_homestead.tmx` (menambahkan tanda koma penutup di akhir setiap baris sesuai spesifikasi Tiled TMX & `BaseTmxMapLoader.getTileIds()`).
               - Menerapkan filter tekstur `TextureFilter.Nearest` eksplisit pada `TmxMapLoader.Parameters` agar peta pixel-art tampil tajam.
               - Menambahkan pengujian langsung `BaseTmxMapLoader.getTileIds()` pada seluruh 8 layer peta di unit test CI.
            2. **Tetap Menyertakan Seluruh Perbaikan v3.0.1:**
               - Bebas crash/restart loop (`SafeAndroidFragmentApplication` + `SafeAndroidGraphics` + LibGDX `1.13.5` 16KB ELF).
               - Akses khusus akun login dan sinkronisasi penuh ke database Firebase Firestore akun login.
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
