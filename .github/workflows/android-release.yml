name: Android Release Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "3.0.1"

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x ./gradlew

      - name: Inspect Keystore Fingerprints
        run: |
          ./gradlew signingReport --no-daemon || true

      - name: Run RPG Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleRelease -PversionName="${{ env.APP_VERSION }}-build-${{ github.run_number }}" -PversionCode="${{ github.run_number }}" --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk \;
          fi
          ls -lh build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuranime-APK
          path: build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: "v${{ env.APP_VERSION }}-build-${{ github.run_number }}"
          name: "Yuranime v${{ env.APP_VERSION }} - Fix Crash Loop RPG, Akses Khusus Akun Login & Sinkronisasi Database Cloud (Build #${{ github.run_number }})"
          body: |
            ## Yuranime Android App v${{ env.APP_VERSION }} Release

            ### Pembaruan Utama v${{ env.APP_VERSION }}:
            1. **Perbaikan Total Crash & Restart Loop saat Masuk Willowbrook Cove RPG:**
               - Upgrade LibGDX ke `1.13.5` (dukungan native alignment 16KB ELF `0x4000` & Android 14/15/16).
               - Mengganti host LibGDX dengan `SafeAndroidFragmentApplication` + `SafeAndroidGraphics` yang bebas deadlock `Process.killProcess()` saat transisi orientasi maupun pause/destroy di Android 14/15/16 Samsung One UI.
               - Menggunakan static resource ID (`R.id.rpg_game_container`), `super.onCreate(null)`, `configChanges` lengkap, menghapus bentrok `YuranimeTheme` 60Hz `SideEffect` & deprecated `AndroidVisibilityListener`, serta memproteksi seluruh callback GLThread agar tidak pernah keluar-masuk berulang.
            2. **Khusus Pengguna yang Sudah Login:**
               - Menghapus akses tamu pada layar login (`LoginView`). Menu **Willowbrook Cove RPG** hanya tampil di halaman Profil akun yang sudah login dan dijaga langsung di `RpgGameActivity`.
            3. **Database Per-Akun & Sinkronisasi Penuh Firebase Firestore:**
               - Seluruh tabel Room kini terisolasi per `userUid` (versi DB 2) dan disinkronkan dua arah (save & restore otomatis) ke database Firebase Firestore milik akun pengguna yang sedang login (`users/{uid}` dan `users/{uid}/rpg_saves/starter_homestead`).
          draft: false
          prerelease: false
          make_latest: true
          files: |
            build-output/Yuranime-v${{ env.APP_VERSION }}-b${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
