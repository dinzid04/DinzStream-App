name: Build Android APK & Release

on:
  push:
    branches: [ "**" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release AnimeIn APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/AnimeIn-v1.0.0.apk
          elif [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk build-output/AnimeIn-v1.0.0.apk
          else
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/AnimeIn-v1.0.0.apk \;
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeIn-APK
          path: build-output/AnimeIn-v1.0.0.apk

      - name: Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-build-${{ github.run_number }}"
          gh release create "$TAG_NAME" build-output/AnimeIn-v1.0.0.apk \
            --title "AnimeIn v1.0.0 (Build #${{ github.run_number }})" \
            --notes "Automated APK build from commit ${{ github.sha }}. Ready to install on Android." \
            --latest
